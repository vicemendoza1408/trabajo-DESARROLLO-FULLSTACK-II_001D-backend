# Configuración del backend de Fuma.

spring.application.name=fuma-backend
server.port=8080

# Conexión a MySQL.
# createDatabaseIfNotExist=true crea la base "fuma_db" si todavía no existe.
# El usuario y la clave se leen de variables de entorno (DB_USUARIO y DB_CLAVE).
# Si no existen, se usan los valores después de los dos puntos (root y clave vacía).
spring.datasource.url=jdbc:mysql://localhost:3306/fuma_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:}

# Hibernate crea o actualiza las tablas a partir de las entidades (carpeta model).
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL que se ejecutan (útil para explicar y depurar).
spring.jpa.show-sql=true
