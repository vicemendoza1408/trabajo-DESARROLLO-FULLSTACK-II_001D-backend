# Configuración de las pruebas (perfil "test"): se suma a application.properties y reemplaza solo lo de abajo.
# Usa H2, una base de datos en memoria que se crea al iniciar las pruebas y desaparece al terminar.
# Así las pruebas no tocan la base MySQL real (fuma_db).
spring.datasource.url=jdbc:h2:mem:fuma_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Las tablas se crean al iniciar y se borran al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
